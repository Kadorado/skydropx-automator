# Configuración de Render (Blueprint). Los valores marcados con sync: false se cargan a mano
# en el panel de Render; nunca van en este archivo.
services:
  - type: web
    name: skydropx-automator
    runtime: docker
    plan: starter          # necesario para el disco persistente y para que el bot esté siempre activo
    dockerfilePath: ./Dockerfile
    healthCheckPath: /login
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: SKYDROPX_MODE
        value: live
      - key: SKYDROPX_BASE_URL
        value: https://pro.skydropx.com
      - key: BOT_STATE_FILE
        value: /var/data/bot_state.json
      - key: GUIA_CHECK_MINUTES
        value: "5"
      - key: DEFAULT_VALOR_UNITARIO
        value: "60000"
      - key: SKYDROPX_CLIENT_ID
        sync: false
      - key: SKYDROPX_CLIENT_SECRET
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ALLOWED_CHAT_IDS
        sync: false
      - key: TELEGRAM_ADMIN_CHAT_IDS
        sync: false
